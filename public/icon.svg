<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="112" fill="url(#bg)" />

  <!-- Subtle inner border -->
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="#334155" stroke-width="4" stroke-opacity="0.5" />

  <!-- Shield / Crest base -->
  <g filter="url(#shadow)">
    <!-- Central Hexagon / Rounded badge -->
    <rect x="96" y="96" width="320" height="320" rx="64" fill="#1e293b" stroke="#3b82f6" stroke-width="6" />

    <!-- Bar chart rising graph -->
    <rect x="144" y="270" width="44" height="96" rx="8" fill="#3b82f6" />
    <rect x="206" y="210" width="44" height="156" rx="8" fill="#60a5fa" />
    <rect x="268" y="160" width="44" height="206" rx="8" fill="#10b981" />
    <rect x="330" y="240" width="44" height="126" rx="8" fill="url(#gold)" />

    <!-- Trend line overlay -->
    <path d="M 166 250 L 228 190 L 290 140 L 352 210" fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="290" cy="140" r="12" fill="#10b981" stroke="#ffffff" stroke-width="4" />

    <!-- Currency / MKT tag -->
    <rect x="176" y="380" width="160" height="32" rx="16" fill="#0f172a" stroke="#475569" stroke-width="2" />
    <text x="256" y="402" text-anchor="middle" fill="#94a3b8" font-family="system-ui, sans-serif" font-weight="700" font-size="16" letter-spacing="3">MKT BUDGET</text>
  </g>
</svg>
